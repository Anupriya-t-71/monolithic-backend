apiVersion: apps/v1
kind: Deployment
metadata:
 name: eflow-deployment
spec:
 replicas: 1
 selector:
  matchLabels:
   app: eflow-backend
 template:
  metadata:
   labels:
    app: eflow-backend
  spec:
   containers:
    - name: eflow-backend
      image: 192.168.49.2:8090/monolithic/eflow-backend:1.0
      ports:
       - containerPort: 3000     
